<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{% block title %}Abyss Tracker{% endblock %}</title>
<style>
  :root {
    --bg: #111111;
    --surface: #1c1c1c;
    --border: #383838;
    --text: #ADADAD;
    --text-hi: #e8e8e8;
    --accent: #F07C00;
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
  }
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  nav .brand {
    color: var(--accent);
    font-weight: 700;
    font-size: 18px;
    text-decoration: none;
    letter-spacing: 0.5px;
  }
  nav a {
    color: var(--text);
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 4px;
  }
  nav a:hover { color: var(--text-hi); background: rgba(255,255,255,0.04); }
  nav .spacer { flex: 1; }
  nav .who { font-size: 13px; color: var(--text); }
  nav .who .name { color: var(--text-hi); }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  h1 { color: var(--text-hi); font-weight: 500; margin: 0 0 20px; }
  h2 { color: var(--text-hi); font-weight: 500; margin: 24px 0 12px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  .card .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { color: var(--text-hi); font-size: 22px; font-weight: 500; margin-top: 4px; }
  .card .value.accent { color: var(--accent); }
  .card .value.good { color: var(--good); }
  .card .value.bad { color: var(--bad); }
  .card .sub { font-size: 12px; margin-top: 4px; opacity: 0.7; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: rgba(255,255,255,0.02); color: var(--text-hi); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
  tr:last-child td { border-bottom: none; }
  select, button {
    background: var(--bg);
    color: var(--text-hi);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
  }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); cursor: pointer; }
  button.primary:hover { filter: brightness(1.1); }
  a.btn {
    display: inline-block;
    background: var(--accent);
    color: #111;
    padding: 8px 16px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: 500;
  }
  .filter-bar { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .pill.loot { background: rgba(74, 222, 128, 0.15); color: var(--good); }
  .pill.filament { background: rgba(240, 124, 0, 0.15); color: var(--accent); }
  .pill.ammo { background: rgba(240, 124, 0, 0.15); color: var(--accent); }
  .pill.other { background: rgba(173, 173, 173, 0.15); color: var(--text); }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
<nav>
  <a class="brand" href="/">ABYSS TRACKER</a>
  <a href="/">Dashboard</a>
  <a href="/runs">Runs</a>
  <a href="/txns">Transactions</a>
  <span class="spacer"></span>
  {% if character_name %}
    <span class="who">char: <span class="name">{{ character_name }}</span></span>
    <a href="/sso/logout">Logout</a>
  {% endif %}
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
